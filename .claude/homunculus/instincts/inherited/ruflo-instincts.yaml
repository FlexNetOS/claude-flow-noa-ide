# Ruflo Workflow Add Domain Plugin Adapter

## Action

Follow the add-domain-plugin-adapter workflow:
1. Create a thin ClaudeFlowPlugin wrapper in the domain's src/ directory (e.g., memory-plugin.ts, security-plugin.ts).
2. Register the service in the service container with a unique key.
3. Ensure all required exports are re-exported via index.ts (barrel file) if needed.
4. Verify with TypeScript (tsc --noEmit --skipLibCheck) for zero errors.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~8x per month
- Files: v3/@claude-flow/*/src/*-plugin.ts, v3/src/*/*-plugin.ts, plugins/ruflo-*/src/*-plugin.ts

